name: Bug report
description: Report incorrect behavior, a crash, or a regression
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please avoid including secrets, private paths, or sensitive command output.
  - type: input
    id: version
    attributes:
      label: Acclorite version
      description: Output of `acclorite --version`, or the commit hash for a development build.
      placeholder: "Acclorite 0.3.5"
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution
      placeholder: "CachyOS / Arch Linux / Ubuntu / Fedora / openSUSE / Void"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the query/command and the result you observed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Relevant Doctor output
      description: Paste only the relevant, non-sensitive section from `acclorite doctor` when useful.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Build flags, package-manager state, logs, or a minimal reproduction.
